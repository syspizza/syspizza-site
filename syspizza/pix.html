function tlv(id,v){v=String(v);return id+String(new TextEncoder().encode(v).length).padStart(2,'0')+v}
function crc16(s){let c=0xffff;for(const b of new TextEncoder().encode(s)){c^=b<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&65535:(c<<1)&65535}return c.toString(16).toUpperCase().padStart(4,'0')}
function gerarPix(p,valor,id){let chave=String(p.chave).trim(),nome=String(p.recebedor).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 .-]/g,' ').trim().slice(0,25).toUpperCase(),cidade=String(p.cidade).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 .-]/g,' ').trim().slice(0,15).toUpperCase();if(!chave||!nome||!cidade||!Number.isFinite(valor)||valor<=0)throw Error('Dados de pagamento inválidos');const conta=tlv('00','br.gov.bcb.pix')+tlv('01',chave);const corpo=tlv('00','01')+tlv('26',conta)+tlv('52','0000')+tlv('53','986')+tlv('54',valor.toFixed(2))+tlv('58','BR')+tlv('59',nome)+tlv('60',cidade)+tlv('62',tlv('05','***'))+'6304';return corpo+crc16(corpo)}
async function carregar(){const msg=document.getElementById('mensagem');try{const qs=new URLSearchParams(location.search),token=qs.get('token')||'',unidade=qs.get('unidade')||'';if(!/^[a-f0-9]{48}$/.test(token)||!/^\d{3}$/.test(unidade))throw Error('Link Pix inválido');const u=new URL(API);u.searchParams.set('acao','consultarPixPedido');u.searchParams.set('unidade',unidade);u.searchParams.set('token',token);const r=await fetch(u.toString(),{redirect:'follow'});const j=await r.json();if(!j.ok)throw Error(j.erro||'Pagamento indisponível');const payload=gerarPix(j.pix,Number(j.valor),j.pedidoId);document.getElementById('valor').textContent=Number(j.valor).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});document.getElementById('recebedor').textContent='Recebedor: '+j.pix.recebedor;document.getElementById('pedido').textContent='Pedido: '+j.pedidoId;document.getElementById('dados').hidden=false;const area=document.getElementById('qrcode');area.hidden=false;if(typeof QRCode==='undefined')throw Error('Não foi possível carregar o gerador do QR Code.');new QRCode(area,{text:payload,width:235,height:235,correctLevel:QRCode.CorrectLevel.M});const campo=document.getElementById('codigo');campo.value=payload;campo.hidden=false;const botao=document.getElementById('copiar');botao.hidden=false;botao.onclick=async()=>{try{await navigator.clipboard.writeText(payload);msg.style.color='#14885f';msg.textContent='Código Pix copiado!'}catch(_){campo.select();document.execCommand('copy');msg.textContent='Selecione e copie o código Pix.'}};msg.textContent=''}catch(e){msg.textContent=e.message+' Se acabou de fazer o pedido, aguarde alguns segundos e atualize esta página.'}}carregar();
